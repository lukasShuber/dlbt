[build-system]
requires = ["setuptools>=42", "wheel"]  # Add build dependencies
build-backend = "setuptools.build_meta"

[project]
name = "dlbt"
version = "0.1.0"
description = "Deep Latent Belief Tomography"
authors = [
    { name = "Lukas S. Huber", email = "lukas.s.huber@unibe.ch" },
    { name = "Michael J. Lee", email = "mil@mit.edu" }
]
license = { file = "license.md" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "torch>=2.3",
    "torchvision>=0.18",
    "Pillow>=10.0",
    "open_clip_torch>=2.24",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
